<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Бухлометр — калькулятор алкоголя в крови</title>
  <desc id="hero-desc">Считает промилле и время до полного вытрезвления по формуле Видмарка-Зайдля. Справа — реальный результат расчёта: 0.48 промилле, лёгкое опьянение, около 3 часов 12 минут до вытрезвления.</desc>

  <rect width="1200" height="360" rx="26" fill="#0f0f0f"/>

  <!-- Левая колонка: категория, имя, обещание, стек -->
  <g id="title-block">
    <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2.6" fill="#8a8a8a">КАЛЬКУЛЯТОР АЛКОГОЛЯ В КРОВИ</text>

    <text x="60" y="190" font-family="Georgia, 'Times New Roman', serif"
          font-size="82" font-weight="700" letter-spacing="1" fill="#ffffff">БУХЛОМЕТР</text>

    <text x="64" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" fill="#d8d8d8">Промилле и время до вытрезвления</text>
    <text x="64" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" fill="#d8d8d8">по формуле Видмарка-Зайдля</text>

    <text x="64" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="1.2" fill="#6f6f6f">Vue 3 · TypeScript · Vite · MIT</text>
  </g>

  <!-- Правая колонка: настоящая карточка результата из приложения -->
  <g id="project-proof">
    <rect x="700" y="70" width="436" height="242" rx="18" fill="#161616" stroke="#2e2e2e" stroke-width="1"/>

    <text x="728" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="1.6" fill="#8a8a8a">КОНЦЕНТРАЦИЯ В КРОВИ</text>

    <text x="728" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="62" font-weight="700" fill="#ffffff">0.48 ‰</text>

    <text x="728" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="600" letter-spacing="1.2" fill="#d8d8d8">ЛЁГКОЕ ОПЬЯНЕНИЕ</text>

    <!-- Шкала уровня: тот же индикатор, что в интерфейсе -->
    <rect x="728" y="238" width="380" height="8" rx="4" fill="#2e2e2e"/>
    <rect x="728" y="238" width="61" height="8" rx="4" fill="#ffffff"/>

    <text x="728" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6f6f6f">0</text>
    <text x="1108" y="272" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6f6f6f">3 ‰</text>

    <text x="728" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#8a8a8a">≈ 3 ч 12 мин до вытрезвления</text>
  </g>
</svg>
